name: Build Chat Sir Lax Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies and build web bundle
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Rename APK output
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ChatSirLax-v2.4.0.apk

      - name: Upload Chat Sir Lax APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatSirLax-Android-APK
          path: ChatSirLax-v2.4.0.apk
          retention-days: 90
