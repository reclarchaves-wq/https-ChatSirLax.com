    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Ignore WebSocket connection errors from Vite HMR in iframe preview
      window.addEventListener('unhandledrejection', function(e) {
        if (e.reason && (
          (typeof e.reason.message === 'string' && e.reason.message.toLowerCase().includes('websocket')) ||
          (typeof e.reason === 'string' && e.reason.toLowerCase().includes('websocket'))
        )) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      });
      window.addEventListener('error', function(e) {
        if (e.message && e.message.toLowerCase().includes('websocket')) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      });
    </script>
